name: CI — Build, Lint, Audit, Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm biome check apps/web/app apps/web/lib apps/web/components apps/web/stores apps/api/src packages/shared/src

      - name: Build
        run: pnpm --filter @webcraft/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test_key

      - name: Audit
        run: pnpm audit --production || true
        continue-on-error: true

      - name: Install Playwright browsers
        run: pnpm --filter @webcraft/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter @webcraft/web test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test_key
